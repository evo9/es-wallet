# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # Domain depends on the WalletRepository port, not the adapter — wire the one
    # implementation explicitly (autowiring won't guess interface -> impl on its own).
    App\Wallet\Domain\WalletRepository: '@App\Wallet\Infrastructure\Persistence\EventSourcedWalletRepository'

    # Application never imports Infrastructure (see CLAUDE.md); the retry helper takes
    # the conflict exception as a plain class-string precisely so this binding — not a
    # `use` statement in Application code — is the only place that names it.
    App\Wallet\Application\RetryOnConcurrencyConflict:
        arguments:
            $conflictExceptionClass: 'App\Wallet\Infrastructure\EventStore\ConcurrencyException'

    # Every Upcaster implementation is auto-tagged and collected here — a new upcaster
    # class just needs to exist to be picked up, no extra wiring.
    _instanceof:
        App\Wallet\Infrastructure\EventStore\Upcaster\Upcaster:
            tags: ['app.event_upcaster']

    App\Wallet\Infrastructure\EventStore\Upcaster\UpcasterChain:
        arguments:
            $upcasters: !tagged_iterator app.event_upcaster
