framework:
    messenger:
        failure_transport: failed

        # Safety net for message types that (temporarily or permanently) have no
        # handler — e.g. queries dispatched fire-and-forget-style in tests.
        buses:
            messenger.bus.default:
                default_middleware:
                    allow_no_handlers: true

        transports:
            async: '%env(MESSENGER_TRANSPORT_DSN)%'
            failed: 'doctrine://default?queue_name=failed'

        routing:
            # ProjectableEvent, not the domain event itself: the projector needs the
            # aggregate's stream position (last_version) for idempotency, and that is
            # attached at dispatch time — see ProjectableEvent.
            'App\Wallet\Infrastructure\Projection\ProjectableEvent': async
